; HUD Speedometer - Nucleo-L432KC
; Open this folder in VS Code with the PlatformIO extension installed.
; Build = checkmark icon.  Upload = arrow icon.  Nothing else to configure.

[env:nucleo_l432kc]
platform      = ststm32
board         = nucleo_l432kc
framework     = stm32cube

upload_protocol = stlink
debug_tool      = stlink

build_flags =
    -D USE_HAL_DRIVER
    -D STM32L432xx
    -Wall
    -O2
